<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#050b08" />
    <title>Memecoin Desk</title>
    <link rel="stylesheet" href="/styles.css?v=desk-1" />
    <script src="/app.js?v=desk-1" defer></script>
  </head>
  <body>
    <div class="wrap">
      <header>
        <div class="mark">M</div>
        <div class="brand">
          <h1>Memecoin Desk</h1>
          <div class="sub">Solana &middot; paper</div>
        </div>
        <div class="ctrls">
          <button id="btnRun" class="btn go" type="button">Start</button>
          <button id="btnStop" class="btn stop" type="button">Stop</button>
        </div>
        <div class="spacer"></div>
        <div class="hmeta" id="meta"></div>
        <span id="status" class="badge"><span class="dot"></span><span id="statusText">connecting</span></span>
      </header>

      <div id="error" class="err"></div>
      <div class="grid kpis" id="kpis"></div>

      <div class="main">
        <section class="card">
          <h2>Equity history &mdash; paper, SOL</h2>
          <div class="chartwrap" id="chartwrap">
            <div id="chart"></div>
            <div class="tip" id="tip"></div>
          </div>
        </section>
        <section class="card">
          <h2>Activity log</h2>
          <div class="log" id="feed"></div>
        </section>
      </div>

      <section class="card" style="margin-bottom: 13px">
        <div class="deskhead">
          <h2 style="margin: 0">Desk &middot; 6 agents</h2>
          <div class="deskstat">
            <span class="pendbadge" id="deskPending" hidden></span>
            <span class="n" id="deskScanned">0</span> scanned <i>&middot;</i>
            <span class="n" id="deskTraded">0</span> traded
          </div>
        </div>
        <div class="agents" id="agents"></div>
      </section>

      <div class="cols two" style="margin-bottom: 13px">
        <section class="card">
          <h2>Funnel &mdash; this session</h2>
          <div id="funnel"></div>
        </section>
        <section class="card">
          <h2>Kills by reason</h2>
          <div id="kills"></div>
        </section>
      </div>

      <div class="cols two">
        <section class="card">
          <h2>Closed trades</h2>
          <div id="closed"></div>
        </section>
        <section class="card">
          <h2>Scored but did not trade</h2>
          <div id="near"></div>
        </section>
      </div>

      <footer id="footer"></footer>
    </div>

    <div class="modal" id="modal" hidden>
      <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="mTitle">
        <div class="sheetTop">
          <div>
            <h3 id="mTitle">Settings</h3>
            <div class="sheetBlurb" id="mBlurb"></div>
          </div>
          <button class="x" id="mClose" type="button" aria-label="Close">&times;</button>
        </div>
        <div class="sheetBody" id="mBody"></div>
        <div class="sheetFoot">
          <div class="sheetMsg" id="mMsg"></div>
          <div class="sheetBtns">
            <button class="btn" id="mCancel" type="button">Cancel</button>
            <button class="btn go" id="mSave" type="button">Save</button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
